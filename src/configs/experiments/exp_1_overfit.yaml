# @package _global_
#надеюсь этот эксп сразу на 10 баллов

defaults:
  - /train_cnn_gru
  - _self_

model:
  dropout: 0.0 #(0.0) (0,0)

datasets:
  train:
    part: train-clean-100
    limit: 10
    max_audio_length: 6.7
    max_text_length: 140
    instance_transforms: ${transforms.instance_transforms.inference}
  val:
    part: train-clean-100
    limit: 10
    max_audio_length: 6.7
    max_text_length: 140
    instance_transforms: ${transforms.instance_transforms.inference}

dataloader:
  batch_size: 2
  num_workers: 0
  pin_memory: false

optimizer:
  weight_decay: 0.0

lr_scheduler:
  steps_per_epoch: 5

writer:
  run_name: exp_1_overfit

trainer:
  n_epochs: 100
  epoch_len: null
  log_step: 10
  early_stop: 0
  monitor: "min val_CER_(Argmax)"
  resume_from: null
