# @package _global_
defaults:
  - exp_3_speed
  - _self_

writer:
  run_name: exp_15_speed_specaug_gru512

optimizer:
  lr: 0.0006

lr_scheduler:
  max_lr: 0.0006

model:
  rnn_hidden: 512
  dropout: 0.2

train_transforms:
  spectrogram:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: src.transforms.spec_augs.frequency_masking.FrequencyMasking
        max_width: 12
        num_masks: 2
        p: 1.0
      - _target_: src.transforms.spec_augs.time_masking.TimeMasking
        max_ratio: 0.05
        max_width: 40
        num_masks: 2
        p: 1.0
