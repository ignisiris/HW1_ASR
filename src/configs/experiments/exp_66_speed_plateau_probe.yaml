# @package _global_
defaults:
  - exp_3_speed
  - _self_

writer:
  run_name: exp_66_speed_plateau_probe

optimizer:
  lr: 0.0001

lr_scheduler:
  max_lr: 0.0001
  pct_start: 0.1

trainer:
  n_epochs: 15
  from_pretrained: saved/frozen_parents/exp_3_speed.pth

train_transforms:
  spectrogram:
    _target_: torch.nn.Sequential
    _args_:
      - _target_: src.transforms.spec_augs.frequency_masking.FrequencyMasking
        max_width: 6
        num_masks: 1
        p: 1.0
      - _target_: src.transforms.spec_augs.time_masking.TimeMasking
        max_ratio: 0.03
        max_width: 30
        num_masks: 1
        p: 1.0
