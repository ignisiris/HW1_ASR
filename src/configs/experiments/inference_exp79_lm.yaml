# @package _global_
defaults:
  - /inference_cnn_gru
  - _self_

model:
  rnn_hidden: 512
  rnn_layers: 7
  fc_hidden: 512
  dropout: 0.2

inferencer:
  from_pretrained: saved/exp79/model_best.pth
  save_path: exp79_lm
  decoder: beam_lm
  beam_size: 32
  lm_path: saved/exp79/word_lm_train_all.pkl
  lm_alpha: 1.0
  word_bonus: 1.0
