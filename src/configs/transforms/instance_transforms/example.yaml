train:
  get_spectrogram: # special key for getting spectrogram
    _target_: src.transforms.log_mel.LogMel
    sample_rate: 16000
    n_mels: 128
    n_fft: 1024
    win_length: 400
    hop_length: 160
  audio: # name of the tensor on which we apply transform
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: src.transforms.wav_augs.Gain
inference:
  get_spectrogram:
    _target_: src.transforms.log_mel.LogMel
    sample_rate: 16000
    n_mels: 128
    n_fft: 1024
    win_length: 400
    hop_length: 160
