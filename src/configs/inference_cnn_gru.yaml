defaults:
  - model: cnn_gru
  - datasets: custom
  - dataloader: example
  - transforms: example_only_instance
  - _self_

dataloader:
  batch_size: 8
  num_workers: 0
  pin_memory: false

metrics:
  inference: []

text_encoder:
  _target_: src.text_encoder.CTCTextEncoder

inferencer:
  device_tensors: [spectrogram]
  device: auto
  save_path: cnn_gru
  seed: 42
  from_pretrained: saved/exp_2_cnn_gru/model_best.pth
  decoder: greedy
  beam_size: 16
